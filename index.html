<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tsukiyo Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@400;500&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     TSUKIYO STUDIO — bloc 1 (hero)
     Scène de référence : 1920 × 1080. Toutes les cotes ci-dessous sont
     exprimées dans ce repère, puis la scène est mise à l'échelle sur la
     largeur d'écran (ratio 16:9 conservé).

     Polices
       Cormorant Garamond : logo, navigation, paragraphe, liens,
                            « CRÉER UN DEMAIN PLUS BEAU »
       Montserrat         : petites capitales espacées
                            (tagline, SCROLL, ART / PEOPLE / …)
       Noto Serif JP      : accroche japonaise verticale (mincho)
     ===================================================================== */
  :root {
    --serif: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
    --sans:  "Montserrat", "Helvetica Neue", Arial, sans-serif;
    --jp:    "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --ivory: #efe7db;                 /* texte clair, sur la roche      */
    --ink:   #2a2622;                 /* texte sombre, sur le ciel      */
    /* Ombres portées : halo doux sous le texte clair, quasi nulle sous le sombre */
    --shadow-light: 0 1px 2px rgba(0,0,0,.45), 0 5px 20px rgba(0,0,0,.35);
    --shadow-dark:  0 1px 2px rgba(0,0,0,.10);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #0d0c0b; overflow: hidden; }

  /* Le hero occupe exactement la fenêtre : aucun scroll possible.
     --s = facteur d'échelle (posé en JS) = min(largeur/1920, hauteur/1080).
     Deux calques 1920×1080 partagent ce facteur : l'un ancré au bord gauche,
     l'autre au bord droit, centrés verticalement. À 1920×1080 ils coïncident
     exactement avec la maquette ; sur un autre ratio la composition reste
     collée aux bords sans jamais déborder.                                   */
  .hero { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; --s: 1; --sbg: 1; }
  /* Fond en trois calques (repère 1920×1080, mis à l'échelle en "cover" par --sbg) :
       bg1-3 : ciel, lune, montagnes (opaque)          — plein cadre
       bg1-2 : personnage (détouré, livré agrandi)      — échelle 0.588, position (30, 194) en 1672 px
       bg1-1 : roche + pin + feuillage rouge (détouré)  — plein cadre, au premier plan
     Ordre bas → haut : ciel, roche, personnage (l'écharpe passe devant la roche). Position du
     personnage retrouvée par recalage sur bg1.png. */
  .bg {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--sbg, 1));
    transform-origin: center;
  }
  .bg img { position: absolute; display: block; }
  .bg .sky   { left: 0; top: 0; width: 1920px; height: 1080px; }
  .bg .hero-char { left: 34.4px; top: 222.8px; width: 1129.0px; height: auto; }
  /* Personnage animé (Three.js) : même cadre que bg1-2, avec une marge de 80×40 px pour les mouvements */
  .bg .hero-wind { position: absolute; display: none; left: -19.6px; top: 195.8px; width: 1237.0px; height: 689.4px; }
  /* Le calque roche livré est plus clair et plus saturé que bg1.png (feuillage rouge trop
     présent). Correction mesurée par recalage sur l'original : -22 % de luminosité, -45 % de
     saturation — améliore feuillage, roche, falaise et pin sans en dégrader aucun.        */
  .bg .rock  { left: 0; top: 0; width: 1920px; height: 1080px; filter: brightness(.78) saturate(.55); }
  .stage {
    position: absolute; top: 50%;
    width: 1920px; height: 1080px;
    color: var(--ivory);
    -webkit-font-smoothing: antialiased;
    pointer-events: none;
  }
  .stage > * { position: absolute; pointer-events: auto; }
  .stage.left  { left: 0;  transform-origin: left center;  transform: translateY(-50%) scale(var(--s)); }
  .stage.right { right: 0; transform-origin: right center; transform: translateY(-50%) scale(var(--s)); }

  /* ---------- Logo + tagline ---------- */
  .logo {
    left: 82px; top: 65px;
    font: 400 56px/1 var(--serif);
    letter-spacing: .42em;
    text-shadow: var(--shadow-light);
  }
  .tagline {
    left: 86px; top: 147px;
    font: 500 12.4px/25px var(--sans);
    letter-spacing: .37em;
    text-transform: uppercase;
    text-shadow: var(--shadow-light);
  }

  /* ---------- Navigation ---------- */
  .nav { left: 1331px; top: 55px; color: var(--ink); text-shadow: var(--shadow-dark); }
  .nav a { position: absolute; top: 0; font: 700 19.5px/1 var(--serif); color: inherit; text-decoration: none; white-space: nowrap; }
  .nav a:nth-child(1) { left: 0; }
  .nav a:nth-child(2) { left: 100px; }
  .nav a:nth-child(3) { left: 212px; }
  .nav a:nth-child(4) { left: 341px; }
  .menu {
    left: 1807px; top: 43px; width: 48px; height: 48px;
    border: 1.8px solid var(--ink); border-radius: 50%;
  }
  .menu::after {
    content: ""; position: absolute; left: 13px; right: 13px; top: 50%;
    height: 1.2px; background: var(--ink);
  }

  /* ---------- Indicateur de scroll ---------- */
  .scroll-line { left: 83px; top: 515px; width: 1.5px; height: 133px; background: var(--ivory); }
  .scroll-icon { left: 68px; top: 671px; width: 36px; height: 34px; }
  .scroll-label {
    left: 71px; top: 729px;
    font: 500 12px/1 var(--sans); letter-spacing: .33em; text-transform: uppercase;
    text-shadow: var(--shadow-light);
  }

  /* ---------- Accroche japonaise ---------- */
  .jp {
    left: 1700px; top: 205px;
    writing-mode: vertical-rl;
    font: 700 38px/60px var(--jp);
    letter-spacing: .02em;
    color: var(--ink);
    text-shadow: var(--shadow-dark);
    height: 390px;
  }
  .jp span { display: block; }
  .jp span:last-child { margin-top: 7px; }
  .jp-tick { left: 1730px; top: 580px; width: 1.5px; height: 26px; background: var(--ink); }
  .creer {
    left: 1712px; top: 623px;
    font: 700 13.8px/25px var(--serif); letter-spacing: .27em; text-transform: uppercase;
    color: var(--ink); text-shadow: var(--shadow-dark);
  }

  /* ---------- Bas gauche ---------- */
  .rule { left: 84px; top: 839px; width: 36px; height: 1px; background: var(--ivory); }
  .intro {
    left: 78px; top: 859px;
    font: 500 26.7px/34.4px var(--serif);
    text-shadow: var(--shadow-light);
    white-space: nowrap;
  }
  .cta { top: 964px; height: 33px; font: 600 22px/1 var(--serif); color: var(--ivory); text-decoration: none; text-shadow: var(--shadow-light); white-space: nowrap; }
  .cta.projects { left: 79px;  width: 193px; }
  .cta.journal  { left: 361px; width: 192px; }
  .cta::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px; background: var(--ivory); opacity: .9; }
  .cta svg { position: absolute; right: 0; top: 4px; width: 40px; height: 14px; }

  /* ---------- Bas droite ---------- */
  .br {
    left: 1712px; top: 968px;
    font: 600 7.5px/16.5px var(--sans); letter-spacing: .30em; text-transform: uppercase;
    color: var(--ink); text-shadow: var(--shadow-dark);
  }
  .br-rule { left: 1819px; top: 984px; width: 35px; height: 1.5px; background: var(--ink); }
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="bg" aria-hidden="true">
    <img class="sky"       src="bg1-3.png" alt="">
    <img class="rock"      src="bg1-1.png" alt="">
    <img class="hero-char" src="bg1-2.png" alt="">          <!-- version fixe : repli si WebGL indisponible -->
    <canvas class="hero-wind" id="wind"></canvas>            <!-- version animée : corps + cape + écharpe -->
  </div>

  <!-- Calque ancré au bord gauche -->
  <div class="stage left">
    <div class="logo">TSUKIYO</div>
    <div class="tagline">Studio<br>Digital craft<br>For a deeper tomorrow</div>

    <div class="scroll-line"></div>
    <svg class="scroll-icon" viewBox="0 0 28 28" fill="none" stroke="#efe7db" stroke-width="1.2">
      <path d="M 6.5 6.5 A 12 12 0 1 0 14 2" stroke-linecap="round"/>
      <circle cx="12.5" cy="12" r="1.8" fill="#efe7db" stroke="none"/>
    </svg>
    <div class="scroll-label">Scroll</div>

    <div class="rule"></div>
    <p class="intro">Immersive digital experiences<br>shaped by story, craft and atmosphere.</p>
    <a class="cta projects" href="#">View Projects
      <svg viewBox="0 0 38 14" fill="none" stroke="#efe7db" stroke-width="1.2"><path d="M0 7h36M30 1l6 6-6 6"/></svg></a>
    <a class="cta journal" href="#">Enter Journal
      <svg viewBox="0 0 38 14" fill="none" stroke="#efe7db" stroke-width="1.2"><path d="M0 7h36M30 1l6 6-6 6"/></svg></a>
  </div>

  <!-- Calque ancré au bord droit -->
  <div class="stage right">
    <nav class="nav">
      <a href="#">Studio</a><a href="#">Projects</a><a href="#">Journal</a><a href="#">Contact</a>
    </nav>
    <div class="menu" aria-label="Menu"></div>

    <div class="jp"><span>まだ見ぬ、</span><span>美しい未来をつくる</span></div>
    <div class="jp-tick"></div>
    <div class="creer">Créer<br>un demain<br>plus beau</div>

    <div class="br">Art<br>People<br>A brighter tomorrow</div>
    <div class="br-rule"></div>
  </div>
</div>
<script>
  // Facteur d'échelle : la scène 1920×1080 tient toujours entièrement dans la fenêtre.
  (function () {
    var hero = document.getElementById('hero');
    function fit() {
      var w = window.innerWidth / 1920, h = window.innerHeight / 1080;
      hero.style.setProperty('--s',   Math.min(w, h).toFixed(5)); // calques texte : tout tient
      hero.style.setProperty('--sbg', Math.max(w, h).toFixed(5)); // fond : couvre tout
    }
    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
  })();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   Vent sur le personnage — boucle de 9 s parfaitement transparente.
   Trois calques (corps, cape, écharpe) posés sur des maillages plans
   dont les sommets sont déplacés à chaque image. Aucun éclairage :
   matériaux non éclairés, les ombres peintes restent identiques.
   Toutes les pulsations sont des multiples de 2π/T → retour exact à
   l'image 0 à t = T. Ajouter ?t=2.6 à l'URL fige l'instant t (débogage).
   ===================================================================== */
(function () {
  var FRAME = { w: 1672, h: 941 }, M = { x: 80, y: 40 }, T = 9, TAU = Math.PI * 2;
  var LAYERS = [   // ordre bas → haut ; box = zone utile dans le PNG ; s, x, y = recalage dans le cadre bg1-2
    { name: 'body', src: 'bgperso-1.png', box: [801, 17, 1111, 920], s: 0.8375, x: 1078, y: 122, seg: [16, 48], adj: [0.85, 0.485, 1.02, 0], axis: 'v' },
    { name: 'cape', src: 'bgperso-2.png', box: [250, 22, 1449, 924], s: 0.4925, x: 743, y: 270, seg: [48, 48], adj: [0.85, 0.415, 1.03, 0.38], axis: 'v' },
    { name: 'scarf', src: 'bgperso-3.png', box: [22, 279, 1664, 562], s: 0.6375, x: 65, y: 210, seg: [96, 8], adj: [0.85, 0.56, 1.02, 1], axis: 'u' }
  ];
  var canvas = document.getElementById('wind'), still = document.querySelector('.hero-char');
  if (!window.THREE || !canvas) return;
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true }); } catch (e) { return; }
  renderer.setPixelRatio(1);
  renderer.setSize(FRAME.w + 2 * M.x, FRAME.h + 2 * M.y, false);
  renderer.setClearColor(0x000000, 0);
  var scene = new THREE.Scene();
  // Repère : x = pixels du cadre bg1-2, y monde = -y image (l'axe y de Three pointe vers le haut)
  var camera = new THREE.OrthographicCamera(-M.x, FRAME.w + M.x, M.y, -(FRAME.h + M.y), -10, 10);
  camera.position.z = 5;

  var meshes = {}, pending = LAYERS.length, loader = new THREE.TextureLoader();
  LAYERS.forEach(function (L, i) {
    loader.load(L.src, function (tex) {
      tex.minFilter = tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false;
      var bw = L.box[2] - L.box[0], bh = L.box[3] - L.box[1], w = bw * L.s, h = bh * L.s;
      var geo = new THREE.PlaneGeometry(w, h, L.seg[0], L.seg[1]);
      var uv = geo.attributes.uv;                       // UV restreints à la zone utile du PNG
      for (var k = 0; k < uv.count; k++) {
        var u = uv.getX(k), v = uv.getY(k);
        uv.setXY(k, (L.box[0] + u * bw) / FRAME.w, 1 - (L.box[1] + (1 - v) * bh) / FRAME.h);
      }
      var mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false });
      // Correction colorimétrique mesurée sur bg1-2 (les calques livrés sont trop clairs / trop vifs) :
      // contraste autour du gris moyen, luminosité, saturation, puis dégradé d'ombre le long du tissu
      // (écharpe : plus sombre vers l'extrémité ; cape : plus sombre vers le haut/épaules).
      mat.onBeforeCompile = function (sh) {
        sh.uniforms.uAdj    = { value: new THREE.Vector4(L.adj[0], L.adj[1], L.adj[2], L.adj[3]) };
        sh.uniforms.uUvRect = { value: new THREE.Vector4(L.box[0] / FRAME.w, 1 - L.box[3] / FRAME.h, L.box[2] / FRAME.w, 1 - L.box[1] / FRAME.h) };
        sh.uniforms.uAxis   = { value: L.axis === 'u' ? 0 : 1 };
        sh.fragmentShader = sh.fragmentShader
          .replace('#include <common>', '#include <common>\nuniform vec4 uAdj; uniform vec4 uUvRect; uniform float uAxis;')
          .replace('#include <map_fragment>', '#include <map_fragment>\n' + [
            'vec3 c = (diffuseColor.rgb - 0.5) * uAdj.x + 0.5;',
            'c *= uAdj.y;',
            'c = mix(vec3(dot(c, vec3(0.299, 0.587, 0.114))), c, uAdj.z);',
            'float tt = uAxis < 0.5 ? (vUv.x - uUvRect.x) / (uUvRect.z - uUvRect.x) : (uUvRect.w - vUv.y) / (uUvRect.w - uUvRect.y);',
            'c *= min(1.0, 1.0 + uAdj.w * (tt - 0.5));',
            'diffuseColor.rgb = clamp(c, 0.0, 1.0);'].join('\n'));
      };
      var mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(L.x + w / 2, -(L.y + h / 2), 0);
      mesh.renderOrder = i;
      mesh.userData = { orig: geo.attributes.position.array.slice(), w: w, h: h };
      scene.add(mesh); meshes[L.name] = mesh;
      if (--pending === 0) start();
    });
  });

  function w(n) { return TAU * n / T; }                                   // pulsation périodique sur T
  function bump(t, c, hw) { var d = Math.abs(t - c); return d < hw ? .5 * (1 + Math.cos(Math.PI * d / hw)) : 0; }
  // d = [dx, dy] en pixels du cadre, dy > 0 = vers le bas ; u : 0 gauche → 1 droite ; v : 0 haut → 1 bas
  function deform(mesh, fn) {
    var pos = mesh.geometry.attributes.position, o = mesh.userData.orig, W = mesh.userData.w, H = mesh.userData.h;
    for (var k = 0; k < pos.count; k++) {
      var x = o[3 * k], y = o[3 * k + 1];
      var u = Math.min(1, Math.max(0, (x + W / 2) / W)), v = Math.min(1, Math.max(0, (H / 2 - y) / H));  // bornés : pow(x<0, k) = NaN
      var d = fn(u, v);
      pos.setXY(k, x + d[0], y - d[1]);
    }
    pos.needsUpdate = true;
  }

  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var q = new URLSearchParams(location.search), frozen = q.has('t') ? parseFloat(q.get('t')) : null;
  var boost = 0, lastX = null;                                            // le vent réagit un peu à la souris
  addEventListener('mousemove', function (e) { if (lastX !== null) boost = Math.min(.5, boost + Math.abs(e.clientX - lastX) / 900); lastX = e.clientX; });

  function frame(now) {
    var t = frozen !== null ? frozen : (now / 1000) % T;
    boost *= .965;
    /* Chronologie (T = 9 s) : 0 s calme → 1–3 s rafale sur l'écharpe → 2–5 s la cape suit (retard ~450 ms)
       → 5–7 s retombée → 7–9 s résiduel → 9 s = image 0.                                                  */
    var gS = bump(t, 2.6, 2.4), gC = bump(t, 3.1, 2.8), calm = bump(t, 4.5, 4.5);
    var aS = (.12 + .15 * calm + .73 * gS) * (1 + .6 * boost);          // amplitude écharpe
    var aC = (.15 + .15 * calm + .70 * gC) * (1 + .4 * boost);          // amplitude cape
    var tc = t - .45;                                                   // retard de la cape (tissu lourd)

    // Écharpe : attache au cou (u = 1) fixe, influence = (1-u)^1.8 ; 2–3 vagues le long du tissu, légère torsion,
    // vibration fine à l'extrémité. Vent de droite à gauche : phase croissante vers la gauche.
    deform(meshes.scarf, function (u, v) {
      // phases en -k·d : les vagues voyagent du cou (d = 0) vers l'extrémité (d = 1), emportées par le vent
      var d = 1 - u, inf = Math.pow(d, 1.8), ph = -TAU * 2.2 * d;
      var dy = Math.sin(w(2) * t + ph) * 32
             + Math.sin(w(3) * t - TAU * 3.4 * d + 1.3) * 10
             + (v - .5) * Math.sin(w(3) * t - TAU * 3 * d) * 8            // torsion : bords opposés
             + Math.sin(w(6) * t - TAU * 5 * d) * 2 * Math.pow(d, 4);      // vibration du bout
      var dx = Math.sin(w(2) * t + ph + .7) * 6;
      return [dx * aS * inf, dy * aS * inf];
    });
    // Cape : épaules fixes (v = 0), pans inférieurs et côté gauche plus mobiles, oscillation lente et
    // irrégulière, soulèvement pendant la rafale, petits pans déchirés qui vibrent (v^3).
    deform(meshes.cape, function (u, v) {
      var inf = Math.pow(v, 1.7) * (.55 + .45 * (1 - u));
      var dy = Math.sin(w(1) * tc - TAU * 1.1 * (1 - u)) * 7
             + Math.sin(w(2) * tc + TAU * .8 * v + 2) * 4
             - 9 * gC
             + Math.sin(w(5) * t + TAU * 4 * u) * 3 * Math.pow(v, 3);
      var dx = -(5 + 4 * Math.sin(w(1) * tc - TAU * 1.1 * (1 - u) + .6)) * gC;
      return [dx * aC * inf, dy * aC * inf];
    });
    // Corps : respiration de 1,5 px (pieds fixes) ; quelques mèches de cheveux (12 % supérieurs) vibrent de 1 px.
    deform(meshes.body, function (u, v) {
      var breath = Math.sin(w(2) * t) * 1.5 * Math.pow(1 - v, 1.5);
      var hair = v < .12 ? Math.sin(w(7) * t + 10 * u) * 1.2 * (1 - v / .12) : 0;
      return [hair, -breath];
    });
    renderer.render(scene, camera);
    if (!reduced && frozen === null) requestAnimationFrame(frame);
  }
  function start() { still.style.display = 'none'; canvas.style.display = 'block'; requestAnimationFrame(frame); }
  window.__wind = { scene: scene, meshes: meshes, renderer: renderer, camera: camera };   // inspection depuis la console
})();
</script>
</body>
</html>
