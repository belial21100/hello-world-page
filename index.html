<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tsukiyo Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@400;500&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     TSUKIYO STUDIO — bloc 1 (hero)
     Scène de référence : 1920 × 1080. Toutes les cotes ci-dessous sont
     exprimées dans ce repère, puis la scène est mise à l'échelle sur la
     largeur d'écran (ratio 16:9 conservé).

     Polices
       Cormorant Garamond : logo, navigation, paragraphe, liens,
                            « CRÉER UN DEMAIN PLUS BEAU »
       Montserrat         : petites capitales espacées
                            (tagline, SCROLL, ART / PEOPLE / …)
       Noto Serif JP      : accroche japonaise verticale (mincho)
     ===================================================================== */
  :root {
    --serif: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
    --sans:  "Montserrat", "Helvetica Neue", Arial, sans-serif;
    --jp:    "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --ivory: #efe7db;                 /* texte clair, sur la roche      */
    --ink:   #2a2622;                 /* texte sombre, sur le ciel      */
    /* Ombres portées : halo doux sous le texte clair, quasi nulle sous le sombre */
    --shadow-light: 0 1px 2px rgba(0,0,0,.45), 0 5px 20px rgba(0,0,0,.35);
    --shadow-dark:  0 1px 2px rgba(0,0,0,.10);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #0d0c0b; overflow: hidden; }

  /* Le hero occupe exactement la fenêtre : aucun scroll possible.
     --s = facteur d'échelle (posé en JS) = min(largeur/1920, hauteur/1080).
     Deux calques 1920×1080 partagent ce facteur : l'un ancré au bord gauche,
     l'autre au bord droit, centrés verticalement. À 1920×1080 ils coïncident
     exactement avec la maquette ; sur un autre ratio la composition reste
     collée aux bords sans jamais déborder.                                   */
  .hero { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; --s: 1; --sbg: 1; }
  /* Fond en trois calques (repère 1920×1080, mis à l'échelle en "cover" par --sbg) :
       bg1-3 : ciel, lune, montagnes (opaque)          — plein cadre
       bg1-2 : personnage (détouré, livré agrandi)      — échelle 0.588, position (30, 194) en 1672 px
       bg1-1 : roche + pin + feuillage rouge (détouré)  — plein cadre, au premier plan
     Ordre bas → haut : 3, 2, 1. Position du personnage retrouvée par recalage sur bg1.png. */
  .bg {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--sbg, 1));
    transform-origin: center;
  }
  .bg img { position: absolute; display: block; }
  .bg .sky   { left: 0; top: 0; width: 1920px; height: 1080px; }
  .bg .hero-char { left: 34.4px; top: 222.8px; width: 1129.0px; height: auto; }
  .bg .rock  { left: 0; top: 0; width: 1920px; height: 1080px; }
  .stage {
    position: absolute; top: 50%;
    width: 1920px; height: 1080px;
    color: var(--ivory);
    -webkit-font-smoothing: antialiased;
    pointer-events: none;
  }
  .stage > * { position: absolute; pointer-events: auto; }
  .stage.left  { left: 0;  transform-origin: left center;  transform: translateY(-50%) scale(var(--s)); }
  .stage.right { right: 0; transform-origin: right center; transform: translateY(-50%) scale(var(--s)); }

  /* ---------- Logo + tagline ---------- */
  .logo {
    left: 82px; top: 65px;
    font: 400 56px/1 var(--serif);
    letter-spacing: .42em;
    text-shadow: var(--shadow-light);
  }
  .tagline {
    left: 86px; top: 147px;
    font: 500 12.4px/25px var(--sans);
    letter-spacing: .37em;
    text-transform: uppercase;
    text-shadow: var(--shadow-light);
  }

  /* ---------- Navigation ---------- */
  .nav { left: 1331px; top: 55px; color: var(--ink); text-shadow: var(--shadow-dark); }
  .nav a { position: absolute; top: 0; font: 700 19.5px/1 var(--serif); color: inherit; text-decoration: none; white-space: nowrap; }
  .nav a:nth-child(1) { left: 0; }
  .nav a:nth-child(2) { left: 100px; }
  .nav a:nth-child(3) { left: 212px; }
  .nav a:nth-child(4) { left: 341px; }
  .menu {
    left: 1807px; top: 43px; width: 48px; height: 48px;
    border: 1.8px solid var(--ink); border-radius: 50%;
  }
  .menu::after {
    content: ""; position: absolute; left: 13px; right: 13px; top: 50%;
    height: 1.2px; background: var(--ink);
  }

  /* ---------- Indicateur de scroll ---------- */
  .scroll-line { left: 83px; top: 515px; width: 1.5px; height: 133px; background: var(--ivory); }
  .scroll-icon { left: 68px; top: 671px; width: 36px; height: 34px; }
  .scroll-label {
    left: 71px; top: 729px;
    font: 500 12px/1 var(--sans); letter-spacing: .33em; text-transform: uppercase;
    text-shadow: var(--shadow-light);
  }

  /* ---------- Accroche japonaise ---------- */
  .jp {
    left: 1700px; top: 205px;
    writing-mode: vertical-rl;
    font: 700 38px/60px var(--jp);
    letter-spacing: .02em;
    color: var(--ink);
    text-shadow: var(--shadow-dark);
    height: 390px;
  }
  .jp span { display: block; }
  .jp span:last-child { margin-top: 7px; }
  .jp-tick { left: 1730px; top: 580px; width: 1.5px; height: 26px; background: var(--ink); }
  .creer {
    left: 1712px; top: 623px;
    font: 700 13.8px/25px var(--serif); letter-spacing: .27em; text-transform: uppercase;
    color: var(--ink); text-shadow: var(--shadow-dark);
  }

  /* ---------- Bas gauche ---------- */
  .rule { left: 84px; top: 839px; width: 36px; height: 1px; background: var(--ivory); }
  .intro {
    left: 78px; top: 859px;
    font: 500 26.7px/34.4px var(--serif);
    text-shadow: var(--shadow-light);
    white-space: nowrap;
  }
  .cta { top: 964px; height: 33px; font: 600 22px/1 var(--serif); color: var(--ivory); text-decoration: none; text-shadow: var(--shadow-light); white-space: nowrap; }
  .cta.projects { left: 79px;  width: 193px; }
  .cta.journal  { left: 361px; width: 192px; }
  .cta::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px; background: var(--ivory); opacity: .9; }
  .cta svg { position: absolute; right: 0; top: 4px; width: 40px; height: 14px; }

  /* ---------- Bas droite ---------- */
  .br {
    left: 1712px; top: 968px;
    font: 600 7.5px/16.5px var(--sans); letter-spacing: .30em; text-transform: uppercase;
    color: var(--ink); text-shadow: var(--shadow-dark);
  }
  .br-rule { left: 1819px; top: 984px; width: 35px; height: 1.5px; background: var(--ink); }
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="bg" aria-hidden="true">
    <img class="sky"       src="bg1-3.png" alt="">
    <img class="hero-char" src="bg1-2.png" alt="">
    <img class="rock"      src="bg1-1.png" alt="">
  </div>

  <!-- Calque ancré au bord gauche -->
  <div class="stage left">
    <div class="logo">TSUKIYO</div>
    <div class="tagline">Studio<br>Digital craft<br>For a deeper tomorrow</div>

    <div class="scroll-line"></div>
    <svg class="scroll-icon" viewBox="0 0 28 28" fill="none" stroke="#efe7db" stroke-width="1.2">
      <path d="M 6.5 6.5 A 12 12 0 1 0 14 2" stroke-linecap="round"/>
      <circle cx="12.5" cy="12" r="1.8" fill="#efe7db" stroke="none"/>
    </svg>
    <div class="scroll-label">Scroll</div>

    <div class="rule"></div>
    <p class="intro">Immersive digital experiences<br>shaped by story, craft and atmosphere.</p>
    <a class="cta projects" href="#">View Projects
      <svg viewBox="0 0 38 14" fill="none" stroke="#efe7db" stroke-width="1.2"><path d="M0 7h36M30 1l6 6-6 6"/></svg></a>
    <a class="cta journal" href="#">Enter Journal
      <svg viewBox="0 0 38 14" fill="none" stroke="#efe7db" stroke-width="1.2"><path d="M0 7h36M30 1l6 6-6 6"/></svg></a>
  </div>

  <!-- Calque ancré au bord droit -->
  <div class="stage right">
    <nav class="nav">
      <a href="#">Studio</a><a href="#">Projects</a><a href="#">Journal</a><a href="#">Contact</a>
    </nav>
    <div class="menu" aria-label="Menu"></div>

    <div class="jp"><span>まだ見ぬ、</span><span>美しい未来をつくる</span></div>
    <div class="jp-tick"></div>
    <div class="creer">Créer<br>un demain<br>plus beau</div>

    <div class="br">Art<br>People<br>A brighter tomorrow</div>
    <div class="br-rule"></div>
  </div>
</div>
<script>
  // Facteur d'échelle : la scène 1920×1080 tient toujours entièrement dans la fenêtre.
  (function () {
    var hero = document.getElementById('hero');
    function fit() {
      var w = window.innerWidth / 1920, h = window.innerHeight / 1080;
      hero.style.setProperty('--s',   Math.min(w, h).toFixed(5)); // calques texte : tout tient
      hero.style.setProperty('--sbg', Math.max(w, h).toFixed(5)); // fond : couvre tout
    }
    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
  })();
</script>
</body>
</html>
