<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8;
    --fg: #1a1a19;
    --muted: #6b6a66;
    --accent: #c8613a;
    --card: #ffffff;
    --border: #e7e4de;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --fg: #f0efeb;
      --muted: #9a9791;
      --accent: #e08a5f;
      --card: #1e1e1c;
      --border: #2e2d2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  .wave { font-size: 48px; line-height: 1; display: block; margin-bottom: 16px; }
  h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: -.02em; }
  p { margin: 0 0 24px; color: var(--muted); }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent); font-size: 14px; font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  footer { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; }
</style>
</head>
<body>
  <main>
    <span class="wave">👋</span>
    <h1>Hello, world!</h1>
    <p>Cette page est servie par GitHub Pages, et déployée automatiquement.</p>
    <span class="badge"><span class="dot"></span> Hébergement opérationnel</span>
    <footer>
      Page statique — <code>index.html</code><br>
      <span id="ts"></span>
    </footer>
  </main>
  <script>
    document.getElementById('ts').textContent =
      'Chargée le ' + new Date().toLocaleString('fr-FR');
  </script>
</body>
</html>
